aid: socotra
name: Socotra
description: >-
  Socotra is a cloud-native insurance core platform that lets carriers, MGAs, and
  program administrators configure, launch, and operate insurance products across
  any line, geography, or distribution channel. Its Connected Core / Insurance Suite
  exposes a broad REST API covering business accounts, accounts and contacts, quotes
  and quick quotes, policy management and transactions, billing, invoicing and
  payments, claims (FNOL), producer management, work management, documents,
  accounting, reporting, search, moratoriums, configuration, and an event/webhook
  system. The platform ships first-party npm SDKs and CLIs, a schema-driven React UI
  SDK, a hosted Model Context Protocol (MCP) server for AI agents, and per-tenant
  configuration deployment. Backed by 8VC and Insight Partners. This profile was
  enriched by the API Evangelist pipeline from Socotra's public developer surface.

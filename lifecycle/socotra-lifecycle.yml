  note: >-
    Socotra publishes a Deprecations page listing deprecated endpoints and schema
    properties that "will be removed in future releases." It enumerates ~11
    deprecated endpoints (primarily auth/identity and access-mask operations, plus
    snapshot list endpoints) and ~11 deprecated schema properties. No RFC 8594

          deprecated: false
        secret:
          type: string
          deprecated: false
        tag:
          type: string
          deprecated: false
      deprecated: false
    UpdateEndpointRequest:
      type: object
      required:
      - url
      - addHeaders
      - removeHeaders
      properties:
        url:
          type: string
          deprecated: false
        removeHeaders:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        addHeaders:
          type: object
          deprecated: false
          additionalProperties:
            type: array
            deprecated: false
            items:
              type: string
              deprecated: false
        secureSsl:
          type: boolean
          deprecated: false
        hmacEnabled:
          type: boolean
          deprecated: false
        secret:
          type: string
          deprecated: false
        tag:
          type: string
          deprecated: false
      deprecated: false
    RetryStrategyUpdateRequest:
      type: object
      required:
      - attempts
      - interval
      - type
      properties:
        type:
          type: string
          enum:
          - linear
          - exponential
          deprecated: false
        interval:
          type: integer
          format: int64
          deprecated: false
        attempts:
          type: integer
          format: int32
          deprecated: false
      deprecated: false
    FailureHandlingCreateRequest:
      type: object
      required:
      - alertEndpoint
      - divert
      - retryStrategy
      - suspend
      - triggers
      properties:
        alertEndpoint:
          $ref: '#/components/schemas/CreateEndpointRequest'
          deprecated: false
        triggers:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        retryStrategy:
          $ref: '#/components/schemas/RetryStrategyCreateRequest'
          deprecated: false
        divert:
          type: boolean
          deprecated: false
        suspend:
          type: boolean
          deprecated: false
      deprecated: false
    FailureHandlingUpdateRequest:
      type: object
      required:
      - alertEndpoint
      - divert
      - removeAlertEndpoint
      - removeRetryStrategy
      - retryStrategy
      - suspend
      - addTriggers

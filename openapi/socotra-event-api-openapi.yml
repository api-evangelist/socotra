      properties:
        removeAlertEndpoint:
          type: boolean
          deprecated: false
        alertEndpoint:
          $ref: '#/components/schemas/UpdateEndpointRequest'
          deprecated: false
        removeTriggers:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        addTriggers:
          type: array
          deprecated: false

          - processing
          - paused
          - finished
          - failed
          - error
          deprecated: false
        processedAccounts:
          type: integer
          format: int32
          deprecated: false
        totalAccounts:
          type: integer
          format: int32
          deprecated: false
      deprecated: false
    PaymentMigrationRequest:
      type: object
      required:
      - id
      - paymentTime
      - paymentType
      - data
      - paymentItems
      properties:
        createdBy:
          type: string
          format: uuid
          deprecated: false
        id:
          type: string
          deprecated: false
        paymentTime:
          type: string
          format: date-time
          deprecated: false
        paymentItems:
          type: array
          deprecated: false
          items:

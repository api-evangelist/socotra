          - fullPay
          - weekly
          - everyOtherWeek
          - monthly
          - quarterly
          - semiannually
          - annually
          - thirtyDays
          - everyNDays
          deprecated: false
        anchorMode:
          type: string
          enum:
          - generateDay
          - termStartDay
          - dueDay
          deprecated: false
        generateLeadDays:
          type: integer
          format: int32
          deprecated: false

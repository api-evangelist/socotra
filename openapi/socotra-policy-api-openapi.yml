components:
  schemas:
    PolicyMoratoriumElectionHistoryResponse:
      type: object
      required:
      - policyLocator
      - createdAt
      - createdBy
      - moratoriumElections
      properties:
        policyLocator:
          type: string
          format: ulid
          deprecated: false
        moratoriumElections:
          type: object
          deprecated: false
          additionalProperties:
            type: string
            deprecated: false
        createdBy:
          type: string
          format: uuid
          deprecated: false
        createdAt:
          type: string
          format: date-time
          deprecated: false
      deprecated: false
    ConfigMigrationEvents:
      type: object
      properties:
        quote.config.migration.failed:
          $ref: '#/components/schemas/ConfigMigrationEventPayload'
          deprecated: false
        account.config.migration.failed:
          $ref: '#/components/schemas/ConfigMigrationEventPayload'
          deprecated: false
        policy.config.migration.failed:
          $ref: '#/components/schemas/PolicyConfigMigrationEventPayload'
          deprecated: false
      deprecated: false
    ProducersChangeInstructionCreateRequest:
      type: object
      required:
      - action
      allOf:
      - $ref: '#/components/schemas/ChangeInstructionCreateRequest'
        deprecated: false
      - type: object
        properties:
          action:
            type: string
            enum:
            - producers
            deprecated: false
          setProducerCode:
            type: string
            deprecated: false
            maxLength: 128
          clearProducerCode:
            type: boolean
            deprecated: false
          setProducerCodeOfRecord:
            type: string
            deprecated: false
            maxLength: 128
          revertProducerCodeOfRecord:
            type: boolean
            deprecated: false
        deprecated: false
      deprecated: false
    PolicyEvents:
      type: object
      properties:
        policy.migrateOnRenewal.enable:
          $ref: '#/components/schemas/PolicyLocatorData'
          deprecated: false
        policy.migrateOnRenewal.disable:
          $ref: '#/components/schemas/PolicyLocatorData'
          deprecated: false
        policy.anonymize:
          $ref: '#/components/schemas/PolicyLocatorData'
          deprecated: false
      deprecated: false
    UnderwritingFlagResponse:
      type: object
      required:
      - locator
      - referenceLocator
      - clearedBy
      - clearedTime
      - createdTime
      - level
      - note
      - referenceType
      - tag
      - taskCreationResponse
      - createdBy
      properties:
        locator:
          type: string
          format: ulid
          deprecated: false
        level:
          type: string
          enum:
          - info
          - block
          - decline
          - reject
          - approve
          deprecated: false
        referenceType:
          type: string
          enum:
          - quote
          - transaction
          deprecated: false
        referenceLocator:
          type: string
          format: ulid
          deprecated: false
        note:
          type: string
          deprecated: false
        tag:
          type: string
          deprecated: false
        elementLocator:
          type: string
          format: ulid
          deprecated: false
        createdBy:
          type: string
          format: uuid
          deprecated: false
        createdTime:
          type: string
          format: date-time
          deprecated: false
        clearedBy:
          type: string
          format: uuid
          deprecated: false
        clearedTime:
          type: string
          format: date-time
          deprecated: false
        taskCreationResponse:
          $ref: '#/components/schemas/TaskCreationResponse'
          deprecated: false
      deprecated: false
    AutoRenewalResponse:
      type: object
      required:
      - locator
      - policyLocator
      - termLocator
      - autoRenewalState
      - renewalTransactionType
      properties:
        locator:
          type: string
          format: ulid
          deprecated: false
        autoRenewalState:
          type: string
          enum:
          - active
          - discarded
          - doNotRenew
          - issued
          - error
          - terminated
          - invalidated
          deprecated: false
        policyLocator:
          type: string
          format: ulid
          deprecated: false
        termLocator:
          type: string
          format: ulid
          deprecated: false
        renewalTransactionType:
          type: string
          deprecated: false
        renewalTransactionLocator:
          type: string
          format: ulid
          deprecated: false
        renewalTransactionCreateTime:
          type: string
          format: date-time
          deprecated: false
        renewalTransactionCreatedTime:
          type: string
          format: date-time
          deprecated: false
        renewalTransactionAcceptTime:
          type: string
          format: date-time
          deprecated: false
        renewalTransactionAcceptedTime:
          type: string
          format: date-time
          deprecated: false
        renewalTransactionIssueTime:
          type: string
          format: date-time
          deprecated: false
        renewalTransactionIssuedTime:
          type: string
          format: date-time
          deprecated: false
        newTermDuration:

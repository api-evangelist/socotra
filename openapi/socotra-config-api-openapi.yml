components:
  schemas:
    MoratoriumRef:
      type: object
      required:
      - effectiveTime
      - applicationMode
      - billingHoldScope
      - policyHoldScope
      - policyMatchCriteria
      - type
      properties:
        type:
          type: string
          deprecated: false
        description:
          type: string
          deprecated: false
        applicationMode:
          type: string
          description: Indicates whether the moratorium applies to all eligible policies or whether there is an option to opt in or out.
          enum:
          - optIn
          - optOut
          - mandatory
          deprecated: false
        effectiveTime:
          type: string
          format: date-time
          deprecated: false
        endTime:
          type: string
          format: date-time
          description: The time the moratorium ends. This can be set after creation and updated to earlier or later.
          deprecated: false
        policyMatchCriteria:
          description: The criteria used to identify which policies are eligible for the moratorium.
          $ref: '#/components/schemas/MoratoriumPolicyMatchCriteriaRef'
          deprecated: false
        effectiveTimeWaived:
          type: boolean
          description: Indicates whether eligible policies issued after the moratorium effectiveTime are affected.
          deprecated: false
        policyHoldScope:
          description: Must be at least one of either policyHoldScope or billingHoldScope.
          $ref: '#/components/schemas/PolicyHoldScopeRef'
          deprecated: false
        billingHoldScope:
          $ref: '#/components/schemas/BillingHoldScopeRef'
          deprecated: false
        displayName:
          type: string
          deprecated: false
      deprecated: false
    NegativeInvoiceHandlingRef:
      type: object
      required:
      - automaticallySettleNegativeInvoices
      - prioritizeOverlappingCoveragePeriods
      - processingMode
      - targetInvoicePriority
      - targetInvoices
      - yieldExcessToCreditBalance
      properties:
        automaticallySettleNegativeInvoices:
          type: string
          enum:
          - toOpenInvoices
          - toCreditBalance
          - never
          deprecated: false
        prioritizeOverlappingCoveragePeriods:
          type: boolean
          deprecated: false
        targetInvoices:
          type: string
          enum:
          - overlappingCoveragePeriodsOnly
          - overlappingCoverageAndEarlier
          - allOpenInvoices
          deprecated: false
        targetInvoicePriority:
          type: string
          enum:
          - byAmount
          - smallestFirst
          - earliestFirst
          deprecated: false
        processingMode:
          type: string
          enum:
          - accountLevel
          - policyLevel
          deprecated: false
        yieldExcessToCreditBalance:
          type: boolean
          deprecated: false
      deprecated: false
    ResourceGroupRef:
      type: object
      required:
      - selectionStartTime
      - resourceNames
      properties:
        selectionStartTime:
          type: string
          format: date-time
          deprecated: false
        resourceNames:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
      deprecated: false
    ProductRef:
      type: object
      properties:
        extend:
          type: string
          deprecated: false
        abstract:
          type: boolean
          deprecated: false
        defaultInstallmentPlan:
          type: string
          deprecated: false
        defaultBillingPlan:
          type: string
          deprecated: true
        defaultTermDuration:
          type: number
          deprecated: false
        defaultDelinquencyPlan:
          type: string
          deprecated: false
        defaultAutoRenewalPlan:
          type: string
          deprecated: false
        defaultShortfallTolerancePlan:
          type: string
          deprecated: false
        displayName:
          type: string
          deprecated: false
        defaultDurationBasis:
          type: string
          enum:
          - years
          - months
          - weeks
          - days
          - hours
          deprecated: false
        coverageTerms:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        eligibleAccountTypes:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        eligibleTransactionTypes:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        contents:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        documents:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        charges:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        scheduledEvents:
          type: array
          deprecated: false
          items:
            type: string
            deprecated: false
        data:
          type: object
          deprecated: false
          additionalProperties:
            $ref: '#/components/schemas/PropertyRef'
            deprecated: false
        staticData:
          type: object
          deprecated: false
          additionalProperties:
            $ref: '#/components/schemas/PropertyRef'
            deprecated: false
        defaultSearchable:
          type: boolean
          deprecated: false
        pluralType:
          type: string
          deprecated: true
        numberingPlan:
          type: string
          deprecated: false
        numberingString:
          type: string
          deprecated: false
        availability:
          $ref: '#/components/schemas/AvailabilityRef'
          deprecated: false
        withPrecommitReapplication:
          type: boolean
          deprecated: false
        requiresJurisdiction:
          type: boolean
          deprecated: false
        contacts:
          type: object
          deprecated: false
          additionalProperties:
            type: array
            deprecated: false
            items:
              type: string
              deprecated: false
        numberingTrigger:
          type: string
          enum:
          - creation
          - validation
          deprecated: false
        workplanTriggers:
          type: object
          deprecated: false
          additionalProperties:
            type: array
            deprecated: false
            items:
              type: string
              deprecated: false
        riskAssessmentCriteria:
          type: string
          deprecated: false
        producerQualification:
          type: string
          enum:
          - none
          - license
          - appointment
          deprecated: false
        externalNumberingPlan:
          type: string
          deprecated: false
        reservedPolicyNumberRequired:
          type: boolean
          deprecated: false
      deprecated: false
    EventScheduleRef:
      type: object
      required:
      - anchor
      properties:
        anchor:
          type: string
          enum:
          - policyStart
          - policyEnd
          - termStart
          - segmentStart
          deprecated: false
        alignment:
          type: string
          enum:
          - weekStart
          - monthStart
          - yearStart
          deprecated: false
        offset:
          type: object
          deprecated: false
          additionalProperties:
            type: integer
            format: int32
            deprecated: false
        cadence:
          $ref: '#/components/schemas/EventCadenceRef'
          deprecated: false
        suppressOnStatuses:
          type: array
          deprecated: false
          items:
            type: string
            enum:
            - pending
            - expired
            - cancelled
            - cancelPending
            - onRisk
            - delinquent
            - doNotRenew
            deprecated: false
      deprecated: false
    AssistantRef:
      type: object
      properties:
        patTokenSecretRef:
          $ref: '#/components/schemas/SecretKeyRef'
          deprecated: false
        inquiryIntents:

      properties:
        jobLocators:
          type: array
          deprecated: false
          items:
            type: string
            format: ulid
            deprecated: false
      deprecated: false
    AnonymizationRequest:
      type: object
      required:
      - references
      properties:
        references:
          type: object
          deprecated: false
          additionalProperties:
            type: array
            deprecated: false
            items:
              type: string
              format: ulid
              deprecated: false
        includeAcceptedQuotes:
          type: boolean
          deprecated: false
        policyStatuses:
          type: array
          deprecated: false
          items:
            type: string
            enum:
            - pending
            - expired
            - cancelled
            - cancelPending
            - onRisk
            - delinquent
            - doNotRenew

        referenceType:
          type: string
          enum:
          - none
          - account
          - quickQuote
          - quote
          - policy
          - contact
          - fnol
          - payment
          - disbursement
          deprecated: false
        referenceLocator:
          type: string
          format: ulid
          deprecated: false
        updatedAt:
          type: string
          format: date-time
          deprecated: false
        anonymizationState:
          type: string
          enum:
          - identifiable
          - pending
          - anonymized
          deprecated: false
        parentReferenceType:
          type: string
          enum:
          - none
          - account
          - quickQuote
          - quote
          - policy
          - contact
          - fnol
          - payment
          - disbursement

      properties:
        referenceType:
          type: string
          enum:
          - none
          - account
          - quickQuote
          - quote
          - policy
          - contact
          - fnol
          - payment
          - disbursement
          deprecated: false
        references:
          type: array
          deprecated: false
          items:
            $ref: '#/components/schemas/AnonymizationReferencePreviewResponse'
            deprecated: false
      deprecated: false
    TargetReferences:
      type: object
      required:
      - referenceType
      - willAnonymize
      properties:
        referenceType:
          type: string
          enum:
          - none
          - account
          - quickQuote
          - quote
          - policy
          - contact
          - fnol
          - payment
          - disbursement
          deprecated: false
        willAnonymize:
          type: boolean
          deprecated: false
        anonymizableReferenceLocators:
          type: array
          deprecated: false
          items:
            type: string
            format: ulid
            deprecated: false
        restrictedReferenceLocators:
          type: array
          deprecated: false

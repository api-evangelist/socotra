        parentReferenceLocator:
          type: string
          format: ulid
          deprecated: false
        anonymizationJobLocator:
          type: string
          format: ulid
          deprecated: false
        scheduledAt:
          type: string
          format: date-time
          deprecated: false
        anonymizedAt:

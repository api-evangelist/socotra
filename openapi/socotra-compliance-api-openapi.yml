          deprecated: false
        preAnonymizationChildren:
          type: array
          deprecated: false
          items:
            $ref: '#/components/schemas/AnonymizationReferencesBatch'
            deprecated: false
        postAnonymizationChildren:
          type: array
          deprecated: false

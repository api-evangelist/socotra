            $ref: '#/components/schemas/AnonymizationReferencesBatch'
            deprecated: false
      deprecated: false
    AnonymizationReferencesBatch:
      type: object
      required:
      - referenceType
      - referenceLocators
      properties:
        referenceType:
          type: string
          enum:
          - none
          - account
          - quickQuote
          - quote
          - policy
          - contact
          - fnol
          - payment
          - disbursement
          deprecated: false
        referenceLocators:
          type: array
          deprecated: false
          items:
            type: string
            format: ulid
            deprecated: false
        parentJobLocator:
          type: string
          format: ulid
          deprecated: false
      deprecated: false
    FetchAnonymizationJobsRequest:
      type: object
      required:

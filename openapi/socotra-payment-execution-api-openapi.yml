openapi: 3.0.1
info:
  title: Socotra Insurance Suite OpenAPI Definition Payment Execution API
  description: Socotra Insurance Suite API
  termsOfService: https://www.socotra.com
  version: v0
servers:
- url: /
  description: Generated server url
tags:
- name: Payment Execution
paths:
  /payment-execution/{tenantLocator}/paymentProviders:
    post:
      operationId: addPaymentProviderConfiguration
      parameters:
      - name: tenantLocator
        in: path
        required: true
        schema:
          type: string
          format: uuid
          deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BraintreeConfigurationRequest'
                deprecated: false
              - $ref: '#/components/schemas/StripeConfigurationRequest'
                deprecated: false
              deprecated: false
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentProvider'
                deprecated: false
      x-securityGroup: payment-providers
      x-securityPermission:
      - write
      deprecated: false
      tags:
      - Payment Execution
  /payment-execution/{tenantLocator}/financialInstruments/{financialInstrumentLocator}:
    get:
      operationId: fetchPaymentExecutionConfigurationForFinancialInstrument
      parameters:
      - name: tenantLocator
        in: path
        required: true
        schema:
          type: string
          format: uuid
          deprecated: false
      - name: financialInstrumentLocator
        in: path
        required: true
        schema:
          type: string
          format: ulid
          deprecated: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FinancialInstrumentConfigurationResponse'
                deprecated: false
      x-securityGroup: financial-instruments
      x-securityPermission:
      - read
      deprecated: false
      tags:
      - Payment Execution
    post:
      operationId: addPaymentExecutionConfigurationForFinancialInstrument
      parameters:
      - name: tenantLocator
        in: path
        required: true
        schema:
          type: string
          format: uuid
          deprecated: false
      - name: financialInstrumentLocator
        in: path
        required: true
        schema:
          type: string
          format: ulid
          deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialInstrumentConfigurationRequest'
              deprecated: false
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FinancialInstrumentConfigurationResponse'
                deprecated: false
      x-securityGroup: financial-instruments
      x-securityPermission:
      - write
      deprecated: false
      tags:
      - Payment Execution
    patch:
      operationId: updatePaymentExecutionConfigurationForFinancialInstrument
      parameters:
      - name: tenantLocator
        in: path
        required: true
        schema:
          type: string
          format: uuid
          deprecated: false
      - name: financialInstrumentLocator
        in: path
        required: true
        schema:
          type: string
          format: ulid
          deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialInstrumentConfigurationRequest'
              deprecated: false
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FinancialInstrumentConfigurationResponse'
                deprecated: false
      x-securityGroup: financial-instruments
      x-securityPermission:
      - write
      deprecated: false
      tags:
      - Payment Execution
  /payment-execution/{tenantLocator}/paymentProviders/{locator}:
    get:
      operationId: fetchPaymentProviderConfiguration
      parameters:
      - name: tenantLocator
        in: path
        required: true
        schema:
          type: string
          format: uuid
          deprecated: false
      - name: locator
        in: path
        required: true
        schema:
          type: string
          format: ulid
          deprecated: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentProvider'
                deprecated: false
      x-securityGroup: payment-providers
      x-securityPermission:
      - read
      deprecated: false
      tags:
      - Payment Execution
    patch:
      operationId: updatePaymentProviderConfiguration
      parameters:
      - name: tenantLocator
        in: path
        required: true
        schema:
          type: string
          format: uuid
          deprecated: false
      - name: locator
        in: path
        required: true
        schema:
          type: string
          format: ulid
          deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BraintreeConfigurationRequest'
                deprecated: false
              - $ref: '#/components/schemas/StripeConfigurationRequest'
                deprecated: false
              deprecated: false
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentProvider'
                deprecated: false
      x-securityGroup: payment-providers
      x-securityPermission:
      - write
      deprecated: false
      tags:

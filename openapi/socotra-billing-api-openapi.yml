components:
  schemas:
    DelinquencyEventJobData:
      type: object
      required:
      - locator
      - delinquencyEventLocator
      - delinquencyLocator
      - jobStatus
      - triggerTime
      - updatedAt
      - createdAt
      - updatedDelinquencyEventLocators
      properties:
        locator:
          type: string
          format: ulid
          deprecated: false
        delinquencyLocator:
          type: string
          format: ulid
          deprecated: false
        delinquencyEventLocator:
          type: string
          format: ulid
          deprecated: false
        triggerTime:
          type: string
          format: date-time
          deprecated: false
        jobStatus:
          type: string
          enum:
          - queued
          - finished
          - failed
          - running
          deprecated: false
        createdAt:
          type: string
          format: date-time
          deprecated: false
        updatedAt:
          type: string
          format: date-time
          deprecated: false
        cancelled:
          type: boolean
          deprecated: false
        cancellationType:
          type: string
          enum:
          - cancellationRequested
          - rescheduled
          - tenantRetired
          - delinquencySettled
          - delinquencyHeld
          deprecated: false
        updatedDelinquencyEventLocators:
          type: array
          deprecated: false
          items:
            type: string
            format: ulid
            deprecated: false
        processingErrors:
          type: string
          deprecated: false
        rescheduledByLocator:
          type: string
          format: ulid
          deprecated: false
      deprecated: false
